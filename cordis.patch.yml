# dsh-theme-frost bundle patch — inserts this plugin's row into the profile tree.
#
# A normal install adds this package to the profile's bundle stack:
#   dsh plugin --profile web add github:H2CO3w/dsh-theme-frost
# A development copy is linked and added to the same stack with `link:`.
# Either way, restart `dsh web` once after installing.
- insert:
    - id: theme-frost
      name: 'dsh-theme-frost'
